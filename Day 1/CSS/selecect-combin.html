<!-- combinadores
    Combinador de Descendencia (Whitespace):

Selecciona todos los descendientes de un elemento.
    div p {
    /* Todos los elementos <p> que son descendientes de un <div> */
}







Combinador de Clase (.):

Selecciona elementos que tienen una clase específica.
.mi-clase {
    /* Todos los elementos con la clase 'mi-clase' */
}









Combinador de ID (#):

Selecciona el elemento con un ID específico.
#mi-id {
    /* El elemento con el ID 'mi-id' */
}















Combinador de Agrupación (,):

Selecciona varios selectores para aplicar el mismo estilo a múltiples elementos.
h1, h2, h3 {
    /* Aplica estilos a todos los elementos <h1>, <h2>, y <h3> */
}















Combinador de Siguiente Hermano (+):

Selecciona el elemento que es el siguiente hermano inmediato.
h2 + p {
    /* El elemento <p> que es el siguiente hermano inmediato de un <h2> */
}

















Combinador de Hermano Posterior (~):

Selecciona todos los hermanos posteriores del primer elemento.
h2 ~ p {
    /* Todos los elementos <p> que son hermanos posteriores de un <h2> */
}










Combinador de Niño (>):

Selecciona los elementos que son hijos directos de otro elemento.
div > p {
    /* Todos los elementos <p> que son hijos directos de un <div> */
}








Combinador de Atributo ([]):

Selecciona elementos con un atributo específico.
input[type="text"] {
    /* Todos los elementos <input> con el atributo type="text" */
}










Combinador de Pseudo Clase (:):

Selecciona elementos en un estado específico o posición en el documento.
a:hover {
    /* Estilo cuando el enlace es señalado con el mouse */
}
    
    ->>
